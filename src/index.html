<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Motion Labs · Promo</title>
<meta name="description" content="Lyric videos drawn in light and color. A promo film drawn live in the browser with WebGPU.">
<style>
  :root { --bg: #05070b; --fg: #eef2f8; --fg2: #aab4c6; --fg3: #7d879b; --blue: #8cb4ff; --on-blue: #0b1a33; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 500 15px/1.4 "Space Grotesk", system-ui, sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  #film { width: min(100vw, calc(100vh * 16 / 9)); height: auto; aspect-ratio: 16 / 9; display: block; background: var(--bg); cursor: pointer; }
  #ui { position: fixed; inset: 0; pointer-events: none; }
  #status { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: var(--fg2); letter-spacing: .08em; text-align: center; max-width: 80vw; }
  #play { pointer-events: auto; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: none; align-items: center; gap: 14px;
    padding: 16px 30px 16px 22px; border-radius: 999px; border: 1px solid rgba(255,255,255,.16); background: rgba(17,21,29,.6); color: var(--fg);
    font: 500 17px "Space Grotesk", system-ui, sans-serif; letter-spacing: .04em; backdrop-filter: blur(10px); cursor: pointer;
    box-shadow: 0 0 0 1px rgba(140,180,255,.15), 0 0 60px rgba(90,136,255,.25); transition: opacity .4s, transform .4s; }
  #play svg { width: 26px; height: 26px; }
  #play small { display: block; color: var(--fg3); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
  #ui.ready #play { display: inline-flex; }
  #ui.playing #play { opacity: 0; transform: translate(-50%, -50%) scale(.96); pointer-events: none; }
  #scrub { pointer-events: auto; position: absolute; left: 0; right: 0; bottom: 0; height: 18px; cursor: pointer; opacity: 0; transition: opacity .3s; }
  #scrub:hover, #ui:not(.playing) #scrub { opacity: 1; }
  #track { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; background: rgba(255,255,255,.08); }
  #bar { height: 100%; width: 0; background: var(--blue); box-shadow: 0 0 12px var(--blue); }
  #keys { position: absolute; right: 16px; bottom: 22px; color: var(--fg3); font-size: 12px; letter-spacing: .1em; opacity: 0; transition: opacity .3s; }
  #ui.ready:not(.playing) #keys { opacity: 1; }
  @media (max-width: 600px) { #keys { display: none; } }
</style>
</head>
<body>
<div id="stage"><canvas id="film" width="1920" height="1080"></canvas></div>
<div id="ui">
  <div id="status">Loading…</div>
  <button id="play" type="button" aria-label="Play the film with sound">
    <svg viewBox="0 0 24 24" fill="none" stroke="#8cb4ff" stroke-width="1.6"><circle cx="12" cy="12" r="10.5"/><path d="M10 8.2v7.6l6-3.8z" fill="#8cb4ff" stroke="none"/></svg>
    <span>Play the film<small>Sound on · 60 seconds</small></span>
  </button>
  <div id="scrub"><div id="track"><div id="bar"></div></div></div>
  <div id="keys">SPACE play/pause · ← → 5 s · R restart · F fullscreen</div>
</div>
<!--SCRIPTS-->
<script src="vendor-opentype.min.js"></script>
<script src="ink.js"></script>
<script src="gpu.js"></script>
<script src="text.js"></script>
<script src="score.js"></script>
<script src="audio.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
<!--/SCRIPTS-->
</body>
</html>
